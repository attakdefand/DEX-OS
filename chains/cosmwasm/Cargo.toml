[package]
name = "cosmwasm-chain"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
# CosmWasm dependencies - using versions compatible with zeroize 1.3.0
cosmos-sdk-proto = { version = "0.18", optional = true }
cosmrs = { version = "0.15", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Security and crypto dependencies
security = { path = "../../crates/security" }
crypto = { path = "../../crates/crypto" }
tokio = { workspace = true }
futures = { workspace = true }

# Explicitly specify zeroize version to avoid conflicts
zeroize = "1.3.0"

[features]
default = ["cosmos"]
cosmos = ["cosmos-sdk-proto", "cosmrs"]